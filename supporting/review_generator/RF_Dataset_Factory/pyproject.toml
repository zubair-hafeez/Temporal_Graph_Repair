[project]
name = "rf-dataset-factory"
version = "0.1.0a0"
description = "Composable and reproducible synthetic RF experiment studio"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
raytracing = ["sionna-rt==2.1.0", "trimesh>=4.6,<5"]

[project.scripts]
rfdf = "rfdf.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.11,<1", "pyright>=1.1,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfdf", "src/temporal_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
